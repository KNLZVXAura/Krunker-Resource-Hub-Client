name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if this version is already released (never publishes)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write       # OIDC token for Sigstore keyless signing
  attestations: write   # write the provenance attestation

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.vc.outputs.VERSION }}
      TAG: ${{ steps.vc.outputs.TAG }}
      SKIP: ${{ steps.vc.outputs.SKIP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check if version already released
        id: vc
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release version = extraMetadata.version in electron-builder.yml (4-part, e.g. 1.0.1.1);
          # package.json must stay valid semver, so it's only the fallback.
          VERSION=$(sed -n 's/^[[:space:]]*version:[[:space:]]*\([0-9][0-9.]*\)[[:space:]]*$/\1/p' electron-builder.yml | head -1)
          [ -n "$VERSION" ] || VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping build"
            echo "SKIP=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release for $TAG, proceeding with build"
            echo "SKIP=false" >> "$GITHUB_OUTPUT"
          fi

  build-desktop:
    name: Build Windows + Linux
    needs: version-check
    if: needs.version-check.outputs.SKIP == 'false' || inputs.force_build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wine wine32 wine64 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 libgtk-3-0
          WINEDEBUG=-all wine wineboot --init || true

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build source
        run: npm run build

      - name: Build Windows distributables
        env:
          WINEDEBUG: "-all"
        run: npx electron-builder --win -c.electronDist=node_modules/electron/dist-win --publish never

      - name: Build Linux distributables
        run: npx electron-builder --linux -c.electronDist=node_modules/electron/dist-linux --publish never

      # Update without the installer: app.asar plus a small manifest (lite.json), see src/shared/lite-update.ts.
      # Fails the build if app.asar or the Electron stamp is missing, rather than publishing a manifest that
      # would send every client back to the installer.
      - name: Build lite update files
        run: node scripts/lite-release.mjs

      - name: Report build sizes
        run: |
          echo "=== Build output sizes ==="
          ls -lh out/*.exe out/*.AppImage out/*.deb 2>/dev/null || true

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-desktop
          path: |
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/lite/lite.json
            out/lite/*.asar
          if-no-files-found: error

  build-msi:
    name: Build Windows MSI
    needs: version-check
    if: needs.version-check.outputs.SKIP == 'false' || inputs.force_build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # On Windows the postinstall script puts the patched Electron into node_modules/electron/dist
      - name: Install dependencies
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Build source
        shell: bash
        run: npm run build

      - name: Build MSI
        shell: bash
        run: npx electron-builder --win msi --x64 -c.electronDist=node_modules/electron/dist --publish never

      - name: Report build size
        shell: bash
        run: ls -lh out/*.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-msi
          path: out/*.msi
          if-no-files-found: error

  build-mac:
    name: Build macOS (arm64)
    needs: version-check
    if: needs.version-check.outputs.SKIP == 'false' || inputs.force_build
    runs-on: macos-latest
    outputs:
      SIGNED: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Release builds must be Developer ID signed + notarized or Gatekeeper rejects
      # the downloaded DMG. Off main the secrets may be absent and dist-mac.sh makes an
      # ad-hoc test build (those runs can't publish). Require all five secrets or none —
      # a partial set writes a 0-byte notary key and fails with a cryptic auth error.
      - name: Detect signing secrets
        id: signing
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          for v in MAC_CERT_P12 MAC_CERT_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$missing" | wc -w)" -eq 5 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::macOS signing secrets are partially configured — missing:$missing. Set all five or none."
            exit 1
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/krh-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write notary API key
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build macOS DMG
        env:
          # Only point at the notary key when it was actually written (all five secrets set);
          # a half-set APPLE_API_* makes electron-builder demand the rest and fail.
          APPLE_API_KEY: ${{ steps.signing.outputs.enabled == 'true' && format('{0}/notary.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # With all five Apple secrets set, main must produce a signed + notarized DMG
          # (dist-mac.sh hard-fails otherwise). Without them (no Apple Developer account) the
          # ad-hoc signed DMG is used; the release job then flags it in the release notes.
          KRH_REQUIRE_SIGNED: ${{ github.ref == 'refs/heads/main' && steps.signing.outputs.enabled == 'true' && '1' || '' }}
        run: npm run dist:mac

      - name: Report build size
        run: ls -lh out/*.dmg out/*.zip 2>/dev/null || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: |
            out/*.dmg
            out/*-Portable.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: [version-check, build-desktop, build-msi, build-mac]
    # Publish only from main: a dispatch on another branch runs the build jobs (for
    # test artifacts) but must never cut a --latest release of unmerged code. When the Apple
    # secrets are not configured the macOS DMG is only ad-hoc signed; the release is still
    # published and the notes say how to open it (see the "Note unsigned macOS build" step).
    if: needs.version-check.outputs.SKIP == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh out/ 2>/dev/null || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            out/*.exe
            out/*.msi
            out/*.AppImage
            out/*.deb
            out/*.dmg
            out/*-Portable.zip
            out/lite/*.asar

      - name: Generate release notes
        run: |
          git fetch --unshallow 2>/dev/null || true
          chmod +x scripts/generate-release-notes.sh
          scripts/generate-release-notes.sh "${{ needs.version-check.outputs.TAG }}" > /tmp/release-notes.md
          echo "--- Generated release notes ---"
          cat /tmp/release-notes.md

      - name: Note unsigned macOS build
        if: needs.build-mac.outputs.SIGNED != 'true'
        run: |
          cat >> /tmp/release-notes.md <<'EOF'

          ## macOS note
          The macOS (Apple Silicon) DMG and Portable zip are not notarized by Apple, so Gatekeeper warns on first launch. On macOS 14 and earlier, right-click the app, choose **Open**, then **Open** again. On macOS 15 (Sequoia) and later, try to open the app once, then go to **System Settings > Privacy & Security** and click **Open Anyway**. If macOS says the app is damaged, run `xattr -cr "/Applications/KRH Client.app"` (or the path of the portable app) in Terminal and open it again.
          EOF

      - name: Note Windows MSI
        run: |
          cat >> /tmp/release-notes.md <<'EOF'

          ## Windows MSI note
          The `.msi` installer is not code-signed, so Windows SmartScreen may warn on first launch. If the MSI will not open or install:
          - **"Windows protected your PC"**: click **More info**, then **Run anyway**.
          - **Nothing happens or the file is blocked**: right-click the `.msi`, choose **Properties**, tick **Unblock** at the bottom, click **OK** and open it again.
          - **Error 1603, 1618 or "another installation is in progress"**: close other installers (or restart Windows), then try again. If an older KRH Client is installed, remove it under **Settings > Apps > Installed apps** first.
          - **Still failing**: open **Command Prompt** in the folder of the file and run `msiexec /i "KRH.Client-VERSION-Setup.msi" /L*v install.log` (use the real file name), then send `install.log` in an issue. You can also use the normal `Setup.exe` or the Portable version instead, they need no MSI.
          - An antivirus can block a new installer. Check the SHA-256 checksum of the release page and allow the file if it matches.
          EOF

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          for file in out/*.exe out/*.msi out/*.AppImage out/*.deb out/*.dmg out/*-Portable.zip out/lite/lite.json out/lite/*.asar; do
            [ -f "$file" ] || continue
            ASSETS+=("$file")
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "ERROR: No build artifacts found in out/"
            ls -la out/ 2>/dev/null || echo "out/ directory does not exist"
            exit 1
          fi

          echo "Uploading ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"

          gh release create "${{ needs.version-check.outputs.TAG }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ needs.version-check.outputs.TAG }}" \
            --notes-file /tmp/release-notes.md \
            --draft=false \
            --latest \
            "${ASSETS[@]}"
